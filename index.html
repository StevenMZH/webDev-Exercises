<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./tip-calculator/images/favicon-32x32.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Frontend Mentor | Tip calculator app</title>
</head>

<body>
    <div class="logo">
        <img src="tip-calculator/images/logo.svg" alt="" />
    </div>
    <div class="tip-calculator">
        <div class="partOne">
            <label for="">Bill</label>
            <input type="number" class="input bill-input" id="bill-input" min="1" value="1"/>
            <label for="" class="tip">Select Tip %</label>

            <div class="tip">
                <div class="tips tip-5">5%</div>
                <div class="tips tip-5">10%</div>
                <div class="tips active-tip tip-5">15%</div>
                <div class="tips tip-5">25%</div>
                <div class="tips tip-5">50%</div>
    
                <div id="tip-custom"> <input type="number" class="tip-custom" placeholder="CUSTOM" /> </div>
            </div>

            <div class="peopleLabel">
                <label for="">Number of People</label>
                <label for="" class="error">Can't be Zero</label>
            </div>
            <input type="number" class="input people-input" min="1" value="1"/>
        </div>

        <div class="result">
            <div class="tip-amount">
                <div class="text">
                    <p>Tip Amount</p>
                    <p class="person">/ person</p>
                </div>
                <div id="tip-amount" class="amount">$4.27</div>
            </div>
    
            <div class="total">
                <div class="text">
                    <p>Total</p>
                    <p class="person">/ person</p>
                </div>
                <div id="total-amount" class="amount">$32.27</div>
            </div>
    
            <div class="reset">RESET</div>
        </div>
    </div>

    <script src="scripts.js"></script>
    <div class="footer">
        <footer> Coded by Steven.M </footer>
    </div>
</body>

</html>
